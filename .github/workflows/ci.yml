name: CI
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,full]"
      - run: pytest -q
      - run: ruff check src tests --per-file-ignores "src/llm_harness_lite/utils/costs.py:TRY004"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -c "import harness, llm_harness_lite; from harness.llm.router import LLMRouter; assert LLMRouter is llm_harness_lite.LLMRouter"
        working-directory: /tmp
