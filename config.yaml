llm:
  provider: openai_compat   # openai_compat | openai | anthropic | openrouter
  model: qwen3:8b
  base_url: http://localhost:11434/v1
  api_key: dummy
  temperature: 0.2
embed:
  provider: ollama            # openai | ollama
  model: nomic-embed-text
  base_url: http://localhost:11434
store:
  kind: pgvector             # pgvector | qdrant  (same Retriever API)
  pgvector:
    dsn: postgresql://harness:harness@localhost:5432/harness
    table: rag_chunks
    dim: 768
  qdrant:
    url: http://localhost:6333
    collection: rag_chunks
    dim: 768
rag:
  chunk_size: 600
  chunk_overlap: 80
  top_k_vector: 20
  top_k_final: 5
cache:
  path: .harness_cache.db
  semantic_threshold: 0.93
  enabled: true
agent:
  max_steps: 8
  budget_usd: 0.05
mcp:
  servers: []  # e.g. [{command: "npx", args: ["-y","@modelcontextprotocol/server-filesystem","/tmp"]}]
